name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24.x
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package-contract:
    name: Coverage and package contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run pack:check
      - run: npm run smoke:pack
      - name: Install the pinned DeepSeek Harness CLI
        run: npm install --global @deepseek-ai/dsh@0.1.1-rc.2
      - run: npm run smoke:dsh
      - run: npm run smoke:dsh-agent

  wdl-check:
    name: miniwdl 1.15.0 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check miniwdl==1.15.0
      - run: miniwdl check workflows/fastq-qc/1.0.0/main.wdl
      - run: miniwdl check workflows/fastq-qc/1.1.0/main.wdl
      - run: miniwdl check workflows/bam-qc/1.0.0/main.wdl
