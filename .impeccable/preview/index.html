<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bio Workflows UI review</title>
    <style>
      :root { color-scheme: dark; }
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body {
        --dsw-alias-bg-base: #101217;
        --dsw-alias-bg-layer-1: #171a20;
        --dsw-alias-bg-layer-2: #1d2028;
        --dsw-alias-bg-layer-3: #252a34;
        --dsw-alias-label-primary: #f1f3f7;
        --dsw-alias-label-secondary: #b2b8c4;
        --dsw-alias-label-tertiary: #858e9d;
        --dsw-alias-border-l1: rgba(255,255,255,.1);
        --dsw-alias-border-l2: rgba(255,255,255,.18);
        --dsw-alias-button-primary-fill: #5f60ee;
        --dsw-alias-button-primary-hover: #7172f4;
        --dsw-alias-button-primary-foreground: #fff;
        --dsw-alias-interactive-bg-hover: rgba(255,255,255,.075);
        --dsw-alias-status-success: #48c27c;
        --dsw-alias-status-warning: #e4ad43;
        --dsw-alias-status-error: #ee6f78;
        background: #0c0e12;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #graph-root { max-width: 1120px; margin: 48px auto; padding: 0 24px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./preview.js"></script>
  </body>
</html>
